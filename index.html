<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Remove spaces from text and copy to clipboard" />

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TextUtl" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <title>Text Utility</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px env(safe-area-inset-bottom, 16px);
    }

    header {
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2563eb;
    }

    h1 span {
      font-weight: 400;
      color: #64748b;
      font-size: 1rem;
    }

    main {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      background: #fff;
      color: #1e293b;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 140px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:active { transform: scale(0.97); }

    #btn-remove {
      background: #2563eb;
      color: #fff;
    }

    #btn-remove:hover { background: #1d4ed8; }

    #btn-copy {
      background: #10b981;
      color: #fff;
    }

    #btn-copy:hover { background: #059669; }

    #status {
      font-size: 0.875rem;
      color: #64748b;
      min-height: 1.2em;
      text-align: center;
    }

    #status.success { color: #059669; }
    #status.error   { color: #dc2626; }
  </style>
</head>
<body>
  <header>
    <h1>Text Utility <span>— remove spaces</span></h1>
  </header>

  <main>
    <textarea id="text-input" placeholder="Paste your text here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

    <div class="buttons">
      <button id="btn-remove" type="button">Remove Spaces</button>
      <button id="btn-copy"   type="button">Copy to Clipboard</button>
    </div>

    <p id="status" aria-live="polite"></p>
  </main>

  <script>
    'use strict';

    const textarea  = document.getElementById('text-input');
    const btnRemove = document.getElementById('btn-remove');
    const btnCopy   = document.getElementById('btn-copy');
    const status    = document.getElementById('status');

    function showStatus(msg, type) {
      status.textContent = msg;
      status.className = type || '';
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => { status.textContent = ''; status.className = ''; }, 2500);
    }

    btnRemove.addEventListener('click', () => {
      textarea.value = textarea.value.replace(/\s+/g, '');
      showStatus('Spaces removed.', 'success');
    });

    btnCopy.addEventListener('click', async () => {
      const text = textarea.value;
      if (!text) { showStatus('Nothing to copy.', 'error'); return; }
      try {
        await navigator.clipboard.writeText(text);
        showStatus('Copied to clipboard!', 'success');
      } catch {
        // Fallback for older iOS Safari
        textarea.select();
        document.execCommand('copy');
        window.getSelection && window.getSelection().removeAllRanges();
        showStatus('Copied to clipboard!', 'success');
      }
    });

    // Register service worker for PWA / offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
